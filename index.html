<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mon Bilan Prévention – Nouvelle Pharmacie Stéphanie</title>
<style>
:root{--pri:#0f6e66;--pri-d:#0a4f49;--pri-l:#e3f4f2;--ink:#1c2b2a;--mut:#5d6e6c;--bg:#f2f6f6;--card:#fff;--line:#d3dedd;
--red:#b3261e;--red-l:#fdecea;--org:#b85c00;--org-l:#fff1de;--blu:#1f6fb2;--blu-l:#e6f1fb;--grn:#2e7d32;--grn-l:#e7f5e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.4}
header.top{background:var(--pri);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
header.top .brand{font-weight:700;font-size:19px;flex:1}
header.top .brand small{display:block;font-weight:400;font-size:13px;opacity:.85}
header.top button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}
.steps{display:flex;gap:6px;font-size:13px}
.steps span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.15)}
.steps span.on{background:#fff;color:var(--pri);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:28px;margin:0 0 6px}
h2{font-size:22px;margin:0 0 12px}
h3{font-size:18px;margin:16px 0 8px}
.mut{color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
label.f{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #7fcdc5;border-color:var(--pri)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 24px;background:var(--pri);color:#fff;cursor:pointer;min-height:52px}
.btn:disabled{background:#a9bcba;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px}
.btn.warn{background:var(--org)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:space-between;z-index:15}
.bar .in{max-width:1000px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:17px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;min-height:52px;cursor:pointer;text-align:left}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chip.sm{min-height:40px;padding:6px 12px;font-size:15px}
.chip.num{min-width:46px;text-align:center;padding:8px}
.q{padding:16px 0;border-bottom:1px solid #edf2f2}
.q:last-child{border-bottom:0}
.qt{font-weight:600;margin-bottom:10px}
.hint{font-size:14px;color:var(--mut);margin:-6px 0 10px}
.numrow{display:flex;align-items:center;gap:10px;max-width:260px}
.prog{height:8px;background:#dbe6e5;border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--pri)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dots button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--mut)}
.dots button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dots button.done{border-color:var(--pri);color:var(--pri)}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;margin-right:6px}
.b-R{background:var(--red-l);color:var(--red)}.b-O{background:var(--org-l);color:var(--org)}.b-B{background:var(--blu-l);color:var(--blu)}.b-G{background:var(--grn-l);color:var(--grn)}
.alert{border-left:6px solid;border-radius:8px;padding:10px 14px;margin-bottom:8px;background:#fff;border:1px solid var(--line);border-left-width:6px}
.alert.R{border-left-color:var(--red);background:var(--red-l)}.alert.O{border-left-color:var(--org);background:var(--org-l)}.alert.B{border-left-color:var(--blu);background:var(--blu-l)}
.alert .th{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.alert .act{font-size:15px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;font:inherit;text-align:left}
.theme.on{border-color:var(--pri);background:var(--pri-l)}
.theme b{display:block}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--pri-l);border-radius:12px;padding:10px 14px;min-width:150px}
.kpi small{display:block;color:var(--mut);font-size:13px}
.kpi b{font-size:20px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.chk input{width:24px;height:24px;margin-top:2px;flex:none}
details.card summary{cursor:pointer;font-weight:700;font-size:19px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:50;font-size:15px}
.note{background:var(--blu-l);border-radius:10px;padding:10px 14px;font-size:15px}
.note.w{background:var(--org-l)}
.sheet{background:#fff;border:1px solid var(--line);padding:14mm;max-width:210mm;margin:0 auto;font-size:12.5px;line-height:1.35}
.sheet h1{font-size:19px;margin:0}.sheet h2{font-size:14px;margin:12px 0 5px;padding:3px 8px;background:#e3f4f2;border-left:4px solid #0f6e66}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #b8c7c5;padding:4px 6px;vertical-align:top;text-align:left}
.sheet .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.sheet ul{margin:2px 0 4px;padding-left:18px}
.sheet .lh{display:flex;justify-content:space-between;border-bottom:2px solid #0f6e66;padding-bottom:6px;margin-bottom:8px}
.sheet .sm{font-size:11px;color:#444}
.sheet .box{border:1px solid #888;padding:6px 8px;margin:4px 0}
#printArea{display:none}
/* Documents en noir et blanc (écran et impression) */
.sheet,.sheet *{color:#000!important;background:#fff!important;border-color:#000!important;text-shadow:none!important}
.sheet h2{border-left:4px solid #000!important;border-bottom:1px solid #000!important}
.sheet .lh{border-bottom:2px solid #000!important}
.sheet td,.sheet th{border:1px solid #000!important}
.sheet .box{border:1px solid #000!important}
@media print{
  *{-webkit-print-color-adjust:economy;print-color-adjust:economy}
  body{background:#fff;font-size:12px}
  #app,.toast{display:none!important}
  #printArea{display:block}
  #printArea .sheet{border:0;padding:0;max-width:none;margin:0}
  @page{size:A4;margin:11mm}
  .sheet h2,.sheet .box,.sheet table{break-inside:avoid}
}
@media (max-width:700px){.steps{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Mon Bilan Prévention<small id="hsub">Nouvelle Pharmacie Stéphanie · Strasbourg</small></div>
    <div class="steps" id="steps"></div>
    <button data-a="reset">Nouveau patient</button>
  </header>
  <main id="view"></main>
</div>
<div id="printArea"></div>

<script>
/* ============================================================
   CONFIGURATION (à adapter)
   ============================================================ */
const CONFIG={
  pharmacie:'Nouvelle Pharmacie Stéphanie',
  ville:'Strasbourg',
  pin:'1234',               // verrou « espace pharmacien » : simple confort d’usage, PAS une sécurité. À changer.
  services:[                // services proposables à l’officine (cases à cocher dans le cockpit)
    {id:'bpm',label:'Bilan partagé de médication (BPM)'},
    {id:'vaccin',label:'Vaccination à l’officine'},
    {id:'sevrage',label:'Accompagnement au sevrage tabagique'},
    {id:'doccr',label:'Remise du kit de dépistage colorectal'},
    {id:'trod',label:'Dépistage rapide / orientation dépistage VIH-IST'},
    {id:'tension',label:'Automesure / suivi tensionnel'}
  ]
};

/* ============================================================
   OUTILS
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('fr-FR');
const ck=b=>b?'☒':'☐';
const TR={'18':'18–25 ans','45':'45–50 ans','60':'60–65 ans','70':'70–75 ans'};
const trOf=a=>a>=18&&a<=25?'18':a>=45&&a<=50?'45':a>=60&&a<=65?'60':a>=70&&a<=75?'70':null;

let S;
const proName=()=>{const n=(S.ph.pharmacien||'').trim();return n?(/^dr\.?\s/i.test(n)?n:'Dr '+n):'';};
const stamp=()=>{const d=S.t0?new Date(S.t0):new Date();return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});};
function fresh(){
  return {view:'home',sec:0,name:'',first:'',age:'',sex:'',tr:null,forced:null,consent:false,assisted:false,express:false,unlocked:false,doc:'ppp',
    ans:{},
    pharm:CONFIG.pharmacie,t0:null,ph:{sys:'',dia:'',poignet:false,mt:'',nbMeds:'',interact:false,mdph:false,face:'',cast:'',notes:null,pharmacien:'',
        prios:[],priosInit:false,sact:{},obj:{},imp:{},conf:{},acts:{},extra:{},suivi:{},todo:{},com:{},services:{},svcInit:false,transmis:true}};
}
S=fresh();

const A=id=>S.ans[id];
const has=(id,v)=>{const x=S.ans[id];return Array.isArray(x)?x.includes(v):x===v;};
const isF=()=>S.sex!=='H';           // questions « spécifiques femme » (inclut « autre » par prudence)
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
const heightM=()=>{const h=num(A('taille'));if(!h)return null;return h>3?h/100:h;};
const imc=()=>{const h=heightM(),w=num(A('poids'));return h&&w?w/(h*h):null;};

/* ============================================================
   BANQUE DE QUESTIONS — d’après les 4 auto-questionnaires officiels
   (Ministère de la Santé · « Mon Bilan Prévention » 18-25, 45-50, 60-65, 70-75 ans)
   ============================================================ */
const YN=[['oui','Oui'],['non','Non']];
const YNN=[['oui','Oui'],['non','Non'],['nsp','Je ne sais pas']];
const ECH=['Pas du tout','Un peu','Moyennement','Beaucoup'];
const ECHO=ECH.map((l,i)=>[String(i),l]);
const F4=[['0','Jamais'],['1','Plusieurs jours'],['2','Plus de sept jours'],['3','Presque tous les jours']];
const SCR5=[['d','Tous les jours'],['p','Pas tous les jours'],['n','Non']]; // 70-75
const FRUITS=[['5','Au moins 5 portions par jour'],['1-4','Entre 1 et 4 portions par jour'],['tps','De temps en temps'],['rare','Rarement'],['jamais','Jamais']];
const GRAS=[['j','Plusieurs fois par jour'],['sem','Plusieurs fois par semaine'],['1sem','Une fois par semaine'],['1mois','Une fois par mois'],['jamais','Jamais']];
const ASSIS=[['<2','Moins de 2 heures'],['2-4','Entre 2 et 4 heures'],['4-7','Entre 4 et 7 heures'],['>7','Plus de 7 heures'],['nsp','Je ne sais pas']];
const ECRAN=[['<1','Moins d’une heure'],['1-2','Entre 1 et 2 heures'],['2-4','Entre 2 et 4 heures'],['>4','Plus de 4 heures'],['nsp','Je ne sais pas']];
const DEP4=[['m2','Oui, il y a moins de 2 ans'],['p2','Oui, il y a plus de 2 ans'],['j','Non, jamais'],['nsp','Je ne sais pas']];
const FROT=[['m5','Oui, il y a moins de 5 ans'],['p5','Oui, il y a plus de 5 ans'],['j','Non, jamais'],['nsp','Je ne sais pas']];
const MAL={
 '18':[['diab','Diabète'],['congen','Maladie congénitale'],['allergie','Allergie(s)'],['cancer','Cancers'],['resp','Maladies respiratoires (asthme…)'],['psy','Dépression, troubles anxieux et/ou troubles du comportement alimentaire'],['autre','Autre(s) maladie(s)'],['aucune','Aucune']],
 '45':[['metab','Hypertension artérielle, diabète, cholestérol élevé'],['cv','Maladies cardiovasculaires (infarctus, maladie coronaire, insuffisance cardiaque, AVC…)'],['cancer','Cancers'],['resp','Maladies respiratoires (asthme, bronchite chronique, BPCO)'],['mici','Maladie inflammatoire chronique de l’intestin (Crohn, RCH)'],['autre','Autre(s) maladie(s)'],['aucune','Aucune']],
 '60':[['metab','Hypertension artérielle, diabète, cholestérol élevé'],['cv','Maladies cardiovasculaires (infarctus, maladie coronaire, insuffisance cardiaque, AVC…)'],['cancer','Cancers'],['resp','Maladies respiratoires (asthme, bronchite chronique, BPCO)'],['arthrose','Arthrose ou maladie rhumatismale'],['fract','Fracture d’une vertèbre ou du col du fémur et/ou ostéoporose'],['autre','Autre(s) maladie(s)'],['aucune','Aucune']],
 '70':[['cv','Maladies cardiovasculaires (diabète, HTA, insuffisance rénale chronique, insuffisance cardiaque, hypercholestérolémie)'],['cancer','Cancers'],['resp','Maladies respiratoires (asthme, BPCO)'],['mici','Maladie inflammatoire chronique de l’intestin'],['polypes','Polypes colorectaux'],['dmla','Dégénérescence maculaire liée à l’âge (DMLA)'],['fract','Fracture d’une vertèbre ou du col du fémur et/ou ostéoporose'],['aucune','Aucune']]
};
const SUJ={
 '18':[['sommeil','Mieux dormir'],['alim','Améliorer mon alimentation et bouger plus'],['tabac','Réduire ou arrêter le tabac'],['alcool','Réduire ou arrêter l’alcool'],['mental','Améliorer mon bien-être mental, réduire mon stress'],['ecran','Passer moins de temps devant un écran'],['depistage','Mieux m’informer sur les dépistages']],
 '45':[['alim','Améliorer mon alimentation et bouger plus'],['tabac','Réduire ou arrêter le tabac'],['alcool','Réduire ou arrêter l’alcool'],['mental','Améliorer mon bien-être mental, réduire mon stress'],['menopause','Mieux comprendre la ménopause et prévenir certains effets'],['ecran','Passer moins de temps devant un écran'],['depistage','Mieux m’informer sur les dépistages']],
 '60':[['sommeil','Mieux dormir'],['alim','Améliorer mon alimentation et bouger plus'],['tabac','Réduire ou arrêter le tabac'],['alcool','Réduire ou arrêter l’alcool'],['mental','Améliorer mon bien-être mental, réduire mon stress'],['vieillissement','Mieux connaître / prévenir les effets du vieillissement'],['depistage','Mieux m’informer sur les dépistages']],
 '70':[['sommeil','Mieux dormir'],['alim','M’alimenter plus sainement / bouger plus'],['tabac','Arrêter de fumer'],['alcool','Réduire ma consommation d’alcool'],['vieillissement','Entretenir ma mémoire et améliorer mon équilibre'],['violences','Lutter contre / prévenir les violences, harcèlements, discriminations'],['mental','Améliorer mon bien-être mental, être plus zen']]
};
const SECS=[['prio','Mes priorités en santé'],['soc','Vous et votre situation'],['ant','Antécédents et traitements'],['sante','Votre santé actuelle'],['alim','Activité physique et alimentation'],['vacc','Vaccins, dépistages, santé sexuelle'],['addic','Alcool, tabac, autres substances'],['mental','Bien-être mental, sommeil, violences']];
const T4=['18','45','60','70'],T3=['45','60','70'],T2=['45','60'],T1=['18','45','60'];

const Q=[
/* --- Situation --- */
{id:'activite',sec:'soc',ages:['18'],t:'Vous êtes actuellement…',type:'single',opts:[['etudes','En études'],['emploi','En emploi'],['chomage','À la recherche d’un emploi'],['cumul','En cumul études-emploi'],['autre','Autre']]},
{id:'logement',sec:'soc',ages:['18'],t:'Vous habitez…',type:'single',opts:[['seul','Seul(e)'],['parents','Chez vos parents'],['couple','En couple'],['autres','Avec d’autres personnes (amis, colocataires…)']]},
{id:'enfants',sec:'soc',ages:['18','45'],t:()=>S.tr==='45'?'Avez-vous un ou plusieurs enfants à la maison ?':'Avez-vous un ou plusieurs enfants ?',type:'single',opts:YN},
{id:'enfantsSeul',sec:'soc',ages:['18','45'],when:()=>has('enfants','oui'),t:'Les élevez-vous seul(e) ?',type:'single',opts:YN},
{id:'projetEnfant',sec:'soc',ages:['18'],t:'Envisagez-vous d’avoir un enfant dans les 5 prochaines années ?',type:'single',opts:YNN},
{id:'aidant',sec:'soc',ages:T4,t:'Assumez-vous un rôle d’aidant (aide régulière et fréquente à une personne en raison de son âge, d’une maladie ou d’un handicap) ?',type:'single',opts:YN},
{id:'entourage',sec:'soc',ages:T4,t:'En cas de besoin, pouvez-vous compter sur une personne de votre entourage ?',type:'single',opts:YN},
{id:'conditions',sec:'soc',ages:['18','45'],t:()=>S.tr==='18'?'Jugez-vous vos conditions de vie, de travail ou d’études difficiles / pénibles ?':'Vos conditions de vie et/ou de travail sont-elles difficiles / pénibles ?',type:'single',opts:YN},
{id:'contacts',sec:'soc',ages:['60','70'],t:'Au cours des 6 derniers mois, avez-vous eu des contacts avec des proches (amis, famille) ?',type:'single',opts:YN},
{id:'retraiteRegard',sec:'soc',ages:['60','70'],t:'Votre regard sur le fait de passer ou d’être à la retraite est…',type:'single',opts:[['tp','Très positif'],['pp','Plutôt positif'],['pn','Plutôt négatif'],['tn','Très négatif']]},
{id:'retraiteProjets',sec:'soc',ages:['60','70'],t:'À l’approche de la retraite (ou depuis le passage à la retraite), avez-vous de nouveaux projets (passe-temps, sorties, associations…) ?',type:'single',opts:[['fait','Oui, déjà mis en place'],['prevu','Oui, prévus mais pas encore concrétisés'],['non','Non, je ne sais pas encore']]},
/* --- Antécédents --- */
{id:'maladies',sec:'ant',ages:T4,t:'Avez-vous ou avez-vous eu une de ces maladies ou facteurs de risque ?',type:'multi',opts:()=>MAL[S.tr],hint:'Plusieurs réponses possibles'},
{id:'hospit',sec:'ant',ages:['18','70'],t:'Avez-vous déjà été hospitalisé(e) ?',type:'single',opts:YN},
{id:'bilanBio',sec:'ant',ages:T4,t:'À quand remonte votre dernière prise de sang et/ou analyse d’urine ?',type:'single',opts:()=>S.tr==='18'?[['m6','Moins de 6 mois'],['p6','Plus de 6 mois'],['j','Jamais réalisée']]:[['m6','Moins de 6 mois'],['p6','Plus de 6 mois']],hint:'Idéalement, apportez les résultats lors du bilan.'},
{id:'famille',sec:'ant',ages:T4,t:'Des personnes de votre famille proche (mère, père, sœur, frère) ont-elles eu des maladies connues (diabète, hypertension, cancer, infarctus, mort subite, cholestérol familial, ostéoporose…) ?',type:'single',opts:YNN},
{id:'traitement',sec:'ant',ages:T4,t:'Suivez-vous actuellement un traitement ?',type:'single',opts:YN,hint:'Si oui, apportez vos ordonnances si possible.'},
{id:'nbMeds',sec:'ant',ages:T4,when:()=>has('traitement','oui'),t:'Combien de médicaments prenez-vous en tout (avec ou sans ordonnance) ?',type:'num',unit:'médicaments'},
/* --- Santé actuelle --- */
{id:'poidsVar',sec:'sante',ages:T4,t:'Avez-vous constaté une variation de votre poids ces 6 derniers mois ?',type:'single',opts:[['maigre','Oui, un amaigrissement'],['prise','Oui, une prise de poids'],['non','Non']]},
{id:'oedemes',sec:'sante',ages:T3,t:'Avez-vous observé des gonflements importants et/ou inhabituels des chevilles ou des jambes ?',type:'single',opts:YN},
{id:'thorax',sec:'sante',ages:['60'],t:'Vous arrive-t-il d’avoir des douleurs dans la poitrine, notamment lors d’un effort ?',type:'single',opts:YN},
{id:'toux',sec:'sante',ages:T3,t:'Toussez-vous souvent (tous les jours) ?',type:'single',opts:YN},
{id:'touxGrasse',sec:'sante',ages:T3,when:()=>has('toux','oui'),t:'Cette toux ramène-t-elle des crachats (toux grasse) ?',type:'single',opts:YN},
{id:'essouffle',sec:'sante',ages:T3,t:'Êtes-vous plus facilement essoufflé(e) que les personnes de votre âge ?',type:'single',opts:YN},
{id:'apnees',sec:'sante',ages:T3,t:'Faites-vous des pauses respiratoires ou des ronflements importants pendant le sommeil (constatés par votre entourage) ?',type:'single',opts:YNN},
{id:'menopause',sec:'sante',ages:['45'],when:isF,t:'Souhaitez-vous aborder les symptômes de la ménopause (bouffées de chaleur, sommeil, sécheresse vaginale, troubles urinaires, fatigue, anxiété, irritabilité) ?',type:'single',opts:[['oui','Oui'],['non','Non'],['deja','Je suis déjà ménopausée']]},
{id:'menopauseAge',sec:'sante',ages:['60'],when:isF,t:'Si vous êtes une femme, à quel âge avez-vous été ménopausée ?',type:'num',unit:'ans'},
{id:'dentiste',sec:'sante',ages:T4,t:'Êtes-vous allé(e) chez le dentiste dans les 12 derniers mois ?',type:'single',opts:YN},

/* sujets que le bilan suggère de traiter (alertes orange/rouge), hors souhaits du patient : 2 au maximum */
function suggestedTopics(L){
  const wish=(A('sujets')||[]).map(SUJ2PRIO),sc={};
  L.forEach(a=>{if(a.p&&PRIO[a.p]&&(a.l==='R'||a.l==='O')&&!wish.includes(a.p)&&(a.p!=='menopause'||isF()))sc[a.p]=(sc[a.p]||0)+({R:3,O:2}[a.l]);});
  return Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,2);
}

function phq4(){
  const ids=['nerv','inq','interet','triste'];
  if(has('anx15','non'))return {total:0,anx:0,dep:0,complet:true,niv:'normal'};
  const got=ids.filter(i=>A(i)!==undefined);
  if(!got.length)return null;
  const v=i=>A(i)!==undefined?+A(i):0;
  const anx=v('nerv')+v('inq'),dep=v('interet')+v('triste'),total=anx+dep;
  return {total,anx,dep,complet:got.length===4,
    niv:total>=9?'sévère':total>=6?'modéré':total>=3?'léger':'normal'};
}
function fager(){
  if(!(has('tabac','fume')||has('tabac','both')))return null;
  const c=num(A('cigJour')),d=A('delai');
  if(c==null||!d)return null;
  const s1=c<=10?0:c<=20?1:c<=30?2:3;
  const s2={m5:3,m30:2,m60:1,p60:0}[d];
  const t=s1+s2;
  return {total:t,niv:t>=4?'dépendance forte':t>=2?'dépendance modérée':'dépendance faible ou nulle'};
}
const alcoolRisk=()=>{const al=A('alcool')||[];return al.some(x=>['plus2','plus10','pas2j'].includes(x))||num(A('alcool70'))>10;};
const drinks=()=>S.tr==='70'?num(A('alcool70'))!==0:!has('alcool','aucun');
const usesCannabis=()=>(A('subst')||[]).includes('cannabis')||has('subst70','oui');
const nbM=()=>{const p=num(S.ph.nbMeds);return p!=null?p:num(A('nbMeds'));};
function auditC(){
  const ids=['audit1','audit2','audit3'];const got=ids.filter(i=>A(i)!==undefined);
  if(!got.length)return null;
  const t=ids.reduce((n,i)=>n+(num(A(i))||0),0);const thr=S.sex==='H'?4:3;
  return {total:t,thr,pos:t>=thr,dep:t>=10,complet:got.length===3||A('audit1')==='0',niv:t>=10?'évoque une dépendance':t>=thr?'mésusage probable':'sous le seuil'};
}
function castScore(){
  const ids=[1,2,3,4,5,6].map(i=>'cast'+i);const got=ids.filter(i=>A(i)!==undefined);
  if(!got.length)return null;
  const t=ids.reduce((n,i)=>n+(num(A(i))||0),0);
  return {total:t,complet:got.length===6,niv:t>=7?'risque élevé (usage problématique)':t>=3?'risque faible à modéré':'pas de risque'};
}
function scoffScore(){
  if(!has('nourriture','oui'))return null;
  const ids=['scoff1','scoff2','scoff3','scoff4'];
  const t=1+ids.filter(i=>has(i,'oui')).length;
  return {total:t,pos:t>=2,complet:ids.every(i=>A(i)!==undefined)};
}

  if(su.includes('drogues'))add('O','Cannabis / drogues','addic','Consommation d’autres drogues déclarée (12 derniers mois).',{act:'Évaluer fréquence et produits ; orientation médecin / CSAPA ; réduction des risques.'});
  if(su.includes('proto'))add('O','Cannabis / drogues','addic','Consommation de protoxyde d’azote.',{act:'Risques neurologiques (carence en vitamine B12) : orienter vers un médecin en cas de fourmillements, faiblesse ou troubles de l’équilibre.',med:true});
  if(has('jeux','souvent'))add('O','Jeux d’argent','addic','Jeux d’argent fréquents.',{act:'Évaluer le retentissement ; Joueurs info service 09 74 75 13 13.'});
  else if(has('jeux','tps'))add('B','Jeux d’argent','addic','Jeux d’argent occasionnels.');
  /* Vaccins & dépistages */
  if(has('vaccins','non')||has('vaccins','nsp'))add('O','Vaccination','vaccination','Vaccins à jour : '+(has('vaccins','non')?'non':'ne sait pas')+'.',{act:'Consulter le carnet / Mon espace santé ; mise à jour selon le calendrier vaccinal en vigueur.',k:'vaccins',lab:'Vaccinations : mise à jour selon le calendrier vaccinal en vigueur',svc:'vaccin'});
  if(tr==='18'&&(has('hpv','non')||has('hpv','nsp')))add('B','Vaccination','vaccination','Vaccination HPV non faite / inconnue.',{act:'Vérifier l’éligibilité au rattrapage selon les recommandations en vigueur (en général jusqu’à 19 ans révolus ; jusqu’à 26 ans pour les hommes ayant des relations avec des hommes).',k:'hpv',lab:'Vaccination HPV : vérifier l’éligibilité au rattrapage',svc:'vaccin'});
  if(tr==='18')add('B','Vaccination','vaccination','Points à vérifier dans le calendrier vaccinal : rappel dTP (25 ans), ROR (2 doses), hépatite B, méningocoques.');
  if(tr==='45'&&age>=45)add('B','Vaccination','vaccination','Rappel dTP recommandé à 45 ans ; autres vaccins selon situation (grippe, Covid, si risque).');
  if(tr==='60'||tr==='70')add('B','Vaccination','vaccination','Points à vérifier : rappel dTP (65 ans puis tous les 10 ans), grippe, Covid-19, pneumocoque, zona, VRS selon l’âge et les facteurs de risque.');
  /* Col utérus */
  if(fem&&tr==='18'&&(has('frottis18','non')||has('frottis18','nsp')))add('O','Dépistage','depistage','Premier dépistage du cancer du col de l’utérus à 25 ans : non réalisé / inconnu.',{act:'Orientation médecin / sage-femme / gynécologue.',k:'col',lab:'Dépistage du cancer du col de l’utérus (frottis) à planifier'});
  if(fem&&(tr==='45'||tr==='60')){
    const v=A(tr==='45'?'frottis45':'frottis60');
    if(v==='p5'||v==='j'||v==='nsp')add('O','Dépistage','depistage','Dépistage du cancer du col de l’utérus : '+(v==='p5'?'plus de 5 ans':v==='j'?'jamais réalisé':'statut inconnu')+'.',{act:'Dépistage tous les 5 ans (test HPV) entre 30 et 65 ans ; orientation médecin / sage-femme / gynécologue.',k:'col',lab:'Dépistage du cancer du col de l’utérus à planifier'});
  }
  /* CCR / sein */
  const ccrEligible=age>=50&&age<=74;
  const ccrFait=tr==='60'?A('ccr60')==='m2':null;
  if(tr==='45'){
    const d=A('depist45');
    if(d!=='nc'&&d!==undefined){
      if(d==='non'||d==='nsp')add('O','Dépistage','depistage','À 50 ans : dépistage colorectal'+(fem?' et mammographie':'')+' : non réalisé / inconnu.',{act:'Remise du kit de dépistage colorectal possible à l’officine'+(fem?' ; mammographie : prise de rendez-vous.':'.'),k:'ccr',lab:'Dépistage colorectal'+(fem?' + mammographie':'')+' (dès 50 ans)',svc:'doccr'});
    } else add('B','Dépistage','depistage','Dépistages organisés colorectal'+(fem?' et du sein':'')+' : début à 50 ans (avant : seulement si risque élevé, sur avis médical).',{act:'Rechercher un risque élevé (antécédents familiaux, polypes, MICI) → avis médical.'});
  }
  if(tr==='60'){
    const c=A('ccr60'),m=A('mammo60');
    if(c!=='m2')add(age<=74?'O':'B','Dépistage','depistage','Dépistage colorectal : '+({p2:'plus de 2 ans',j:'jamais réalisé',nsp:'statut inconnu'}[c]||'non renseigné')+'.',{act:'Test tous les 2 ans entre 50 et 74 ans ; kit remis à l’officine possible.',k:'ccr',lab:'Dépistage colorectal (test tous les 2 ans, 50-74 ans)',svc:'doccr'});
    if(fem&&m!=='m2')add('O','Dépistage','depistage','Mammographie : '+({p2:'plus de 2 ans',j:'jamais réalisée',nsp:'statut inconnu'}[m]||'non renseignée')+'.',{act:'Mammographie tous les 2 ans entre 50 et 74 ans : prise de rendez-vous.',k:'sein',lab:'Mammographie de dépistage (tous les 2 ans, 50-74 ans)'});
  }
  if(tr==='70'){
    const d=A('depist70');
    if(d!=='oui')add(age<=74?'O':'B','Dépistage','depistage',(fem?'Dépistage colorectal / mammographie : ':'Dépistage colorectal : ')+({non:'non réalisé',nsp:'statut inconnu'}[d]||'non renseigné')+'.',{act:age<=74?'Dépistages organisés jusqu’à 74 ans ; kit colorectal remis à l’officine possible'+(fem?' ; mammographie : prise de rendez-vous.':'.')+'':'Au-delà de 74 ans : discuter de la poursuite avec le médecin traitant.',k:'ccr',lab:(fem?'Dépistage colorectal / mammographie':'Dépistage colorectal')+' : à planifier ou à discuter avec le médecin',svc:'doccr'});
  }
  /* IST */
  const ist=A('ist')||[];
  if(ist.some(x=>['plus1','arret','diag'].includes(x)))add('O','Santé sexuelle','sexuelle','Exposition aux IST : '+[ist.includes('plus1')&&'plusieurs partenaires',ist.includes('arret')&&'projet d’arrêt du préservatif',ist.includes('diag')&&'partenaire avec IST'].filter(Boolean).join(', ')+'.',{act:'Dépistage VIH / IST en laboratoire ; discussion préservatif ; évaluer l’indication d’une PrEP (orientation médecin).',k:'ist',lab:'Dépistage VIH / IST à effectuer',svc:'trod'});
  else if(tr==='18'&&(has('depistIST','non')||has('depistIST','nsp'))&&ist.includes('autre'))add('B','Santé sexuelle','sexuelle','Rapports sexuels sans dépistage IST connu.',{act:'Proposer un dépistage VIH / IST.',k:'ist',lab:'Dépistage VIH / IST à proposer'});
  if(tr==='18'&&has('contraception','non')&&fem&&!(ist.includes('non')))add('B','Santé sexuelle','sexuelle','Pas de contraception déclarée.',{act:has('projetEnfant','oui')?'Projet de grossesse : conseils préconceptionnels (acide folique, vaccinations).':'Vérifier le besoin ; contraception d’urgence, orientation.'});
  /* Traitements */
  const nm=nbM();
  if(nm!=null&&nm>=5)add(age>=65?'O':'B','Médicaments','vieillissement','Polymédication : '+nm+' médicaments.',{act:age>=65?'Bilan partagé de médication à proposer (vérifier les critères d’éligibilité en vigueur) ; revue des interactions.':'Revue des traitements et des interactions.',svc:'bpm'});
  if(S.ph.interact)add('O','Médicaments','','Médicament ou association contre-indiquée repérés.',{act:'Prévenir le prescripteur.',med:true});
  if(has('traitement','oui')&&!(nm!=null))add('B','Médicaments','','Traitement en cours : renseigner le nombre de médicaments (cockpit) pour évaluer la polymédication.');
  const ord={R:0,O:1,B:2};
  L.sort((a,b)=>ord[a.l]-ord[b.l]);
  return L;
}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function rr(){const y=window.scrollY;render();window.scrollTo(0,y);}
function go(v){S.view=v;render();window.scrollTo(0,0);}

function stepsBar(){
  const m={home:0,quest:1,handoff:1,lock:2,cockpit:2,docs:3};
  const n=['Accueil','Questionnaire','Cockpit','Documents'];
  $('#steps').innerHTML=n.map((x,i)=>`<span class="${m[S.view]===i?'on':''}">${i+1}. ${x}</span>`).join('');
}

function render(){
  stepsBar();
  const v=S.view;
  $('#view').innerHTML=v==='home'?vHome():v==='quest'?vQuest():v==='handoff'?vHandoff():v==='lock'?vLock():v==='cockpit'?vCockpit():vDocs();
}

/* ---------- Accueil ---------- */
function selOpts(a,b,cur,u){let h='<option value="">—</option>';for(let i=a;i<=b;i++)h+=`<option value="${i}" ${String(cur)===String(i)?'selected':''}>${i}${u}</option>`;return h;}
function trOpts(){return '<option value="">— Choisir —</option>'+Object.keys(TR).map(k=>`<option value="${k}" ${S.tr===k?'selected':''}>${TR[k]}</option>`).join('');}
function homeOk(){return !!(S.tr&&S.sex&&S.name.trim());}
function vHome(){
  const ok=homeOk();
  return `<div class="card"><h1>Mon Bilan Prévention</h1>
  <p class="mut">Bilan de prévention aux âges clés de la vie, réalisé à l’officine. Quelques minutes ; vous pouvez passer les questions que vous ne souhaitez pas renseigner.</p></div>
  <div class="card"><h2>Identification</h2>
   <div class="row"><div><label class="f">Nom</label><input type="text" data-bind="name" value="${esc(S.name)}" autocomplete="off"></div>
   <div><label class="f">Prénom</label><input type="text" data-bind="first" value="${esc(S.first)}" autocomplete="off"></div>
   <div><label class="f">Tranche d’âge</label><select data-bind="tr">${trOpts()}</select></div></div>
   <div class="row"><div><label class="f">Taille (cm)</label><input type="number" inputmode="numeric" pattern="[0-9]*" min="100" max="220" placeholder="cm" data-bind="ans.taille" value="${esc(S.ans.taille||'')}"></div>
   <div><label class="f">Poids (kg)</label><input type="number" inputmode="decimal" min="30" max="250" step="0.1" placeholder="kg" data-bind="ans.poids" value="${esc(S.ans.poids||'')}"></div></div>
   <h3>Vous êtes</h3>
   <div class="opts">${[['F','Une femme'],['H','Un homme'],['A','Autre']].map(([k,l])=>`<button class="chip ${S.sex===k?'on':''}" data-a="sex" data-v="${k}">${l}</button>`).join('')}</div>
  </div>
  <div class="bar"><div class="in"><span></span><button class="btn" data-a="start" ${ok?'':'disabled'}>Commencer le questionnaire</button></div></div>`;
}

/* ---------- Questionnaire ---------- */
function qHTML(q){
  const t=typeof q.t==='function'?q.t():q.t;
  const opts=typeof q.opts==='function'?q.opts():q.opts;
  const v=S.ans[q.id];let body='';
  if(q.type==='single')body=`<div class="opts">${opts.map(([k,l])=>`<button class="chip ${v===k?'on':''}" data-a="ans" data-q="${q.id}" data-v="${esc(k)}">${esc(l)}</button>`).join('')}</div>`;
  else if(q.type==='multi')body=`<div class="opts">${opts.map(([k,l])=>`<button class="chip ${Array.isArray(v)&&v.includes(k)?'on':''}" data-a="multi" data-q="${q.id}" data-v="${esc(k)}">${esc(l)}</button>`).join('')}</div>`;
  else if(q.type==='num')body=`<div class="numrow"><input type="number" inputmode="decimal" data-bind="ans.${q.id}" value="${esc(v==null?'':v)}"><span class="mut">${q.unit||''}</span></div>`;
  else body=`<textarea data-bind="ans.${q.id}" placeholder="${esc(q.ph?q.ph():'…')}">${esc(v||'')}</textarea>`;
  return `<div class="q"><div class="qt">${esc(t)}</div>${q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}${body}</div>`;
}
function answered(sid){return secQs(sid).filter(q=>{const v=S.ans[q.id];return v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length);}).length;}
function vQuest(){
  const secs=activeSecs();
  if(S.sec>=secs.length)S.sec=secs.length-1;
  const [sid,title]=secs[S.sec];
  const tot=secs.reduce((n,s)=>n+secQs(s[0]).length,0),done=secs.reduce((n,s)=>n+answered(s[0]),0);
  const last=S.sec===secs.length-1;
  return `<div class="prog"><i style="width:${Math.round(done/Math.max(tot,1)*100)}%"></i></div>
   <div class="mut" style="font-size:14px;margin-bottom:8px">${esc(S.first||S.name)} · ${TR[S.tr]} · ${done}/${tot} réponses</div>
   <div class="dots">${secs.map((s,i)=>`<button class="${i===S.sec?'on':answered(s[0])===secQs(s[0]).length?'done':''}" data-a="sec" data-v="${i}">${i+1}. ${esc(s[1])}</button>`).join('')}</div>
   <div class="card"><h2>${esc(title)}</h2>${secQs(sid).map(qHTML).join('')}</div>
   <div class="bar"><div class="in"><button class="btn sec" data-a="prev" ${S.sec===0?'disabled':''}>← Précédent</button>
   <button class="btn" data-a="next">${last?(S.assisted?'Terminer → cockpit':'Terminer le questionnaire'):'Suivant →'}</button></div></div>`;
}

function vHandoff(){
  return `<div class="card" style="text-align:center;padding:50px 20px"><h1>Merci ${esc(S.first||'')} !</h1>
  <p style="font-size:21px">Vos réponses sont enregistrées pour ce bilan.</p>
  <p class="mut">Merci de rendre la tablette au pharmacien, qui va faire le point avec vous.</p>
  <button class="btn" data-a="tolock" style="margin-top:20px">Espace pharmacien</button>
  <p><button class="btn sec sm" data-a="back2q" style="margin-top:10px">← Modifier mes réponses</button></p></div>`;
}
function vLock(){
  return `<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><h2>Espace pharmacien</h2>
  <p class="mut">Saisissez le code pour continuer.</p>
  <input type="password" inputmode="numeric" id="pin" style="text-align:center;font-size:26px;letter-spacing:8px" autocomplete="off">
  <button class="btn" data-a="unlock" style="margin-top:14px;width:100%">Valider</button></div>`;
}

/* ---------- Cockpit ---------- */
function vCockpit(){
  const L=buildAlerts(),P=phq4(),F=fager(),bmi=imc(),AC=auditC(),CS=castScore(),SC=scoffScore();
  const cnt={R:0,O:0,B:0};L.forEach(a=>cnt[a.l]++);
  const wish=(A('sujets')||[]).map(SUJ2PRIO);
  // initialisation des services
  if(!S.ph.svcInit){L.forEach(a=>{if(a.svc&&a.l!=='B')S.ph.services[a.svc]=true;});S.ph.svcInit=true;}
  // score des thèmes
  // les souhaits du patient sont retenus d’office comme priorités (modifiables)
  if(!S.ph.priosInit){S.ph.prios=wish.filter((k,i)=>PRIO[k]&&wish.indexOf(k)===i).slice(0,2);}
  const sug=suggestedTopics(L);
  const todo=todoList(L);
  const ph=S.ph;
  return `<div class="card"><h2>${esc(S.name)} ${esc(S.first)} · ${TR[S.tr]}</h2>
   <div class="kpis">
    <div class="kpi"><small>Alertes</small><b><span class="badge b-R">${cnt.R}</span><span class="badge b-O">${cnt.O}</span><span class="badge b-B">${cnt.B}</span></b></div>
    <div class="kpi"><small>IMC</small><b>${bmi?bmi.toFixed(1):'—'}</b>${bmi?`<small>${bmi>=30?'obésité':bmi>=25?'surpoids':bmi<18.5?'insuffisance pondérale':'corpulence normale'}</small>`:''}</div>
    <div class="kpi"><small>PHQ-4 (anxiété / dépression)</small><b>${P?P.total+'/12':'—'}</b>${P?`<small>${P.niv} · A ${P.anx}/6 · D ${P.dep}/6${P.complet?'':' (incomplet)'}</small>`:''}</div>
    ${F?`<div class="kpi"><small>Fagerström simplifié</small><b>${F.total}/6</b><small>${F.niv}</small></div>`:''}
    ${AC?`<div class="kpi"><small>AUDIT-C (seuil ${AC.thr})</small><b>${AC.total}/12</b><small>${AC.niv}${AC.complet?'':' (incomplet)'}</small></div>`:''}
    ${CS?`<div class="kpi"><small>CAST cannabis</small><b>${CS.total}/24</b><small>${CS.niv}${CS.complet?'':' (incomplet)'}</small></div>`:''}
    ${SC?`<div class="kpi"><small>SCOFF (alimentation)</small><b>${SC.total}/5</b><small>${SC.pos?'positif (≥ 2)':'négatif'}</small></div>`:''}
   </div>
   <p style="margin:10px 0 0"><button class="btn sec sm" data-a="back2q">← Revoir / modifier les réponses</button></p></div>


  <div class="card" style="margin-top:16px"><h2>Données du pharmacien</h2>
   <div class="row"><div><label class="f">Nom de la pharmacie</label><input type="text" data-bind="pharm" value="${esc(S.pharm)}" autocomplete="off"></div>
   <div><label class="f">Nom du professionnel</label><input type="text" data-bind="ph.pharmacien" value="${esc(S.ph.pharmacien)}" autocomplete="off" placeholder="Prénom NOM"></div></div>
   <div class="row">
    <div><label class="f">Tension (mmHg)</label><div class="numrow" style="max-width:none"><input type="number" inputmode="numeric" placeholder="Sys" data-bind="ph.sys" value="${esc(ph.sys)}"><span>/</span><input type="number" inputmode="numeric" placeholder="Dia" data-bind="ph.dia" value="${esc(ph.dia)}"></div></div>
    <label class="chk" style="margin-top:6px"><input type="checkbox" data-bind="ph.poignet" data-rr ${ph.poignet?'checked':''}><span>Tension prise au poignet (tensiomètre de poignet)</span></label>
    <div><label class="f">Médecin traitant</label><div class="opts">${[['oui','Oui'],['non','Non']].map(([k,l])=>`<button class="chip sm ${ph.mt===k?'on':''}" data-a="ph" data-k="mt" data-v="${k}">${l}</button>`).join('')}</div></div>
    <div><label class="f">Nb de médicaments (si différent)</label><input type="number" inputmode="numeric" data-bind="ph.nbMeds" placeholder="${esc(A('nbMeds')||'')}" value="${esc(ph.nbMeds)}"></div>
   </div>
   <div class="row" style="margin-top:10px">
    <div><label class="f">Autre score alcool (FACE, AUDIT)</label><input type="text" data-bind="ph.face" value="${esc(ph.face)}"></div>
    <div><label class="f">Autre score cannabis</label><input type="text" data-bind="ph.cast" value="${esc(ph.cast)}"></div>
   </div>
   <label class="chk"><input type="checkbox" data-bind="ph.interact" data-rr ${ph.interact?'checked':''}><span>Médicament ou association contre-indiquée repérée</span></label>
   <label class="chk"><input type="checkbox" data-bind="ph.mdph" ${ph.mdph?'checked':''}><span>Situation de handicap (inscrit MDPH)</span></label>
   <button class="btn sec sm" data-a="recalc" style="margin-top:6px">Mettre à jour les alertes</button>
  </div>

  <div class="card"><h2>Repérage des risques</h2>
   ${L.length?L.map(a=>`<div class="alert ${a.l}"><div class="th"><span class="badge b-${a.l}">${{R:'Priorité haute',O:'À traiter',B:'À explorer'}[a.l]}</span>${esc(a.th)}</div>${esc(a.txt)}${a.act?`<div class="act">→ ${esc(a.act)}</div>`:''}</div>`).join(''):'<p class="mut">Aucune alerte repérée pour le moment.</p>'}
   <div class="note" style="margin-top:8px">Ces alertes sont une aide au repérage, pas un diagnostic. En cas de suspicion de pathologie non connue ou non suivie, le bilan doit être suivi d’une consultation médicale.</div></div>

  <div class="card"><h2>Priorités (1 ou 2) — décision partagée</h2>
   <p class="mut">Étoile = souhait du patient, retenu d’office · « suggéré » = sujet à traiter ou à envisager d’après le bilan (repris dans les conseils de l’officine).</p>
   <div class="grid">${Object.keys(PRIO).filter(k=>k!=='menopause'||isF()).map(k=>`<button class="theme ${ph.prios.includes(k)?'on':''}" data-a="prio" data-v="${k}"><b>${esc(PRIO[k].l)}</b>${wish.includes(k)?'<span class="badge b-G">★ souhait</span>':''}${sug.includes(k)?'<span class="badge b-B">suggéré</span>':''}</button>`).join('')}</div>
   ${ph.prios.map(k=>{
     const P0=PRIO[k];
     return `<div class="card" style="margin-top:14px;background:#fafdfc"><h3 style="margin-top:0">${esc(P0.l)}</h3>
      <label class="f">Objectif du patient (dans ses mots, repris de ses réponses)</label><textarea data-bind="ph.obj.${k}">${esc(objOf(k))}</textarea>
      <div class="row" style="margin-top:10px"><div><label class="f">Gain pour ma santé</label><div class="opts">${ECH.map((l,n)=>`<button class="chip sm ${scaleOf('imp',k)===n?'on':''}" data-a="scale" data-g="imp" data-k="${k}" data-v="${n}">${l}</button>`).join('')}</div></div>
      <div><label class="f">Confiance en ma capacité</label><div class="opts">${ECH.map((l,n)=>`<button class="chip sm ${scaleOf('conf',k)===n?'on':''}" data-a="scale" data-g="conf" data-k="${k}" data-v="${n}">${l}</button>`).join('')}</div></div></div>
      <label class="f" style="margin-top:12px">Actions concrètes retenues</label>
      ${prioA(k).map((x,i)=>`<label class="chk"><input type="checkbox" data-a="act" data-k="${k}" data-i="${i}" ${(ph.acts[k]||{})[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}
      <label class="f">Autre action / précision</label><textarea data-bind="ph.extra.${k}">${esc(ph.extra[k]||'')}</textarea>
      <label class="f" style="margin-top:8px">Suivi prévu (date, rendez-vous à l’officine…)</label><input type="text" data-bind="ph.suivi.${k}" value="${esc(ph.suivi[k]||'')}">
     </div>`;}).join('')}
  </div>
  ${sug.length?`<div class="card"><h2>Sujets à traiter, ou au moins à envisager</h2>
   <p class="mut">Suggérés par le bilan, hors souhaits du patient (qui sont traités d’office ci-dessus). Cochez les actions à retenir : elles figureront dans les conseils de l’officine ; un sujet sans action cochée n’apparaît pas.</p>
   ${sug.map(k=>`<div style="border-top:1px solid #edf2f2;padding:10px 0"><b>${esc(PRIO[k].l)}</b><div class="mut" style="font-size:13px">${esc(L.filter(a=>a.p===k&&(a.l==='R'||a.l==='O')).map(a=>a.txt).filter((x,i,r)=>x&&r.indexOf(x)===i).join(' '))}</div>
   ${prioA(k).map((x,i)=>`<label class="chk"><input type="checkbox" data-a="sact" data-k="${k}" data-i="${i}" ${sactOn(k,i)?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`).join('')}</div>`:''}

  <div class="card"><h2>Parcours : dépistages, vaccinations, orientations</h2>

/* Actions proposées selon la tranche d’âge et le genre (pas de dépistage du sein / col chez l’homme, pas de colorectal ni sein avant 45 ans) */
function prioA(k){
  let a=PRIO[k].a;
  if(k==='depistage'){
    a=a.filter(x=>!(/colorectal/i.test(x)&&S.tr==='18'));
    a=a.filter(x=>!(/mammographie|frottis/i.test(x)));
    if(isF())a.splice(a.length-1,0,S.tr==='18'?'Prendre rendez-vous pour le frottis (à partir de 25 ans)':'Prendre rendez-vous pour la mammographie (dès 50 ans) ou le frottis selon mon cas');
  }
  return a;
}

function chosenActs(k){
  const sel=S.ph.acts[k]||{};

  (S.ph.extra[k]||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>arr.push(s));
  return arr;
}
function todoList(L){
  const todo=[];const seen={};L.forEach(a=>{if(a.k&&!seen[a.k]){seen[a.k]=1;todo.push([a.k,a.lab]);}});
  if(L.some(a=>a.med))todo.push(['consult','Consultation médicale recommandée afin d’établir ou de préciser un diagnostic']);
  return todo;
}
/* Commentaire proposé automatiquement d’après les réponses ; modifiable (S.ph.com[k]) */
function autoCom(k,L){
  const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
  if(k==='consult'){
    const t=uniq(L.filter(a=>a.med).map(a=>a.txt));
    return 'Motifs repérés : '+t.join(' ')+' Consultation du médecin traitant recommandée.';
  }
  const al=L.filter(a=>a.k===k);
  return uniq(al.map(a=>a.txt)).join(' ')+' '+uniq(al.map(a=>a.act)).join(' ');
}
const comOf=(k,L)=>(S.ph.com&&Object.prototype.hasOwnProperty.call(S.ph.com,k))?S.ph.com[k]:autoCom(k,L).trim();

function autoNotes(L){

  const fav=[];
  if(has('tabac','non'))fav.push('non-fumeur');

  if(has('anx15','non'))fav.push('pas de signe d’anxiété ni de baisse d’humeur sur les 15 derniers jours');
  if(has('activite','oui'))fav.push('activité physique régulière');
  if(fav.length)out.push('Points favorables : '+fav.join(', ')+'.');

  if(pr.length)out.push('Priorités retenues avec le patient : '+pr.join(' ; ')+'.');

  if(sv.length)out.push('Services proposés à l’officine : '+sv.join(', ')+'.');

function setPath(p,val){
  const ks=p.split('.');let o=S;
  for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}
  o[ks[ks.length-1]]=val;
}
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.bind||el.dataset.a)return;
  if(el.type==='checkbox')return;
  setPath(el.dataset.bind,el.value);
  if(S.view==='home'){const b=document.querySelector('[data-a=start]');if(b)b.disabled=!homeOk();}
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.a==='sact'){const k=el.dataset.k,i=+el.dataset.i;S.ph.sact[k]=S.ph.sact[k]||{};S.ph.sact[k][i]=el.checked;return;}
  if(el.dataset.a==='act'){const k=el.dataset.k,i=+el.dataset.i;S.ph.acts[k]=S.ph.acts[k]||{};S.ph.acts[k][i]=el.checked;return;}
  if(el.dataset.a==='svc'){S.ph.services[el.dataset.k]=el.checked;return;}
  if(!el.dataset.bind)return;
  setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
  if(el.dataset.rr!==undefined&&(el.tagName==='SELECT'||el.type==='checkbox'))rr();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='act'||a==='svc'||a==='sact')return;
  const d=el.dataset;
  switch(a){
    case 'reset':if(S.view==='home'||confirm('Effacer toutes les données du patient et recommencer ?')){const keep=[S.pharm,S.ph.pharmacien];S=fresh();S.pharm=keep[0];S.ph.pharmacien=keep[1];render();window.scrollTo(0,0);}break;
    case 'sex':S.sex=d.v;rr();break;
    case 'start':S.t0=new Date().toISOString();S.sec=0;S.unlocked=false;go('quest');break;
    case 'ans':S.ans[d.q]=S.ans[d.q]===d.v?undefined:d.v;rr();break;
    case 'multi':{
      const q=Q.find(x=>x.id===d.q);const excl=['aucune','aucun','non','occas'];
      let cur=Array.isArray(S.ans[d.q])?S.ans[d.q].slice():[];
      if(cur.includes(d.v))cur=cur.filter(x=>x!==d.v);
      else if(excl.includes(d.v))cur=[d.v];
      else{cur=cur.filter(x=>!excl.includes(x));
        if(d.q==='sujets'&&cur.length>=2){toast('2 sujets maximum');break;}
        cur.push(d.v);}
      S.ans[d.q]=cur;rr();break;}
    case 'sec':S.sec=+d.v;go('quest');break;
    case 'prev':S.sec=Math.max(0,S.sec-1);go('quest');break;
    case 'next':{const n=activeSecs().length;if(S.sec<n-1){S.sec++;go('quest');}else{go(S.assisted||S.unlocked?'cockpit':'handoff');}break;}
    case 'back2q':S.sec=0;go('quest');break;
    case 'tolock':go(S.unlocked?'cockpit':'lock');break;
    case 'unlock':{const v=$('#pin').value;if(v===CONFIG.pin){S.unlocked=true;go('cockpit');}else{toast('Code incorrect');$('#pin').value='';}break;}
    case 'ph':S.ph[d.k]=S.ph[d.k]===d.v?'':d.v;rr();break;
    case 'scale':S.ph[d.g][d.k]=+d.v;rr();break;
    case 'prio':{S.ph.priosInit=true;const p=S.ph.prios;const i=p.indexOf(d.v);if(i>=0)p.splice(i,1);else if(p.length>=2)toast('2 priorités maximum');else p.push(d.v);rr();break;}
    case 'docs':S.doc='ppp';go('docs');break;
    case 'doc':S.doc=d.v;rr();break;
    case 'back2c':go('cockpit');break;
    case 'comReset':delete S.ph.com[el.dataset.k];rr();break;
    case 'recalc':rr();toast('Alertes mises à jour');break;
    case 'print':$('#printArea').innerHTML='<div class="sheet">'+$('#sheet').innerHTML+'</div>';window.print();break;
    case 'copy':{const t=plainText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Texte copié')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Texte copié');}catch(_){toast('Copie impossible');}ta.remove();});break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.view==='lock'&&e.target.id==='pin'){e.preventDefault();document.querySelector('[data-a=unlock]').click();}});
render();
window.__app={get S(){return S;},buildAlerts,phq4,fager,Q,qVisible,activeSecs,docPlanFiche,docConseils,trOf,render};
</script>
</body>
